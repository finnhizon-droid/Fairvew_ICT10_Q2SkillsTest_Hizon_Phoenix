<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>ICT 10</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
    --bg-main: #0b0f19;
    --card-bg: rgba(18, 24, 38, 0.85);
    --border-color: rgba(255, 255, 255, 0.08);
    --accent-blue: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.15);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --panel-bg: #161e2e;
}

body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-main);
    background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
}

.container {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 36px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    box-sizing: border-box;
    text-align: left;
}

/* Header Elements */
.header-section {
    margin-bottom: 24px;
}

.badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-blue);
    background: var(--accent-glow);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid rgba(56, 189, 248, 0.2);
    margin-bottom: 12px;
}

.container h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 8px 0;
    color: var(--text-primary);
}

.container > p, .subtitle {
    font-size: 0.875rem;
    color: var(--text-secondary);
    line-height: 1.5;
    margin: 0 0 24px 0;
}

/* Input Styles */
.input-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 8px;
}

input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    color: var(--text-primary);
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    box-sizing: border-box;
    outline: none;
    transition: all 0.2s ease;
}

input[type="text"]:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px var(--accent-glow);
}

/* Button Styles */
button {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.925rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}

button:hover {
    background: #3b82f6;
    box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
}

button:active {
    transform: scale(0.98);
}

/* Results Card Section */
.result {
    margin-top: 28px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 20px;
    text-align: left;
}

.result h3 {
    margin: 0 0 16px 0;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
}

.result p {
    margin: 12px 0;
    color: var(--text-secondary);
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.result b {
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.result span {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    color: var(--accent-blue);
    font-size: 0.95rem;
}
    </style>
</head>
<body>
    <div class="container">
        <header class="header-section">
            <span class="badge">ICT 10 • Periodic Table</span>
            <h1>Nonmetal Explorer</h1>
            <p class="subtitle">Query chemical symbols to retrieve atomic structure and elemental properties.</p>
        </header>

        <div class="search-box-wrapper">
            <label for="nonmetal1" class="input-label">Chemical Symbol</label>
            <input type="text" id="nonmetal1" placeholder="Enter nonmetal (e.g., Xe)..." autocomplete="off">
        </div>

        <button py-click="search_nonmetal">Analyze Nonmetal</button>
        
        <div class="result">
            <h3>Search Results</h3>

            <p><b>Nonmetal Code:</b> <span id="code">—</span></p>
            <p><b>Nonmetal Name:</b> <span id="name">—</span></p>
            <p><b>Atomic Number ($Z$):</b> <span id="number">—</span></p>
            <p><b>Atomic Mass ($u$):</b> <span id="mass">—</span></p>
        </div>

        <script type="py" src="main.py"></script>
    </div>
</body>
</html>
